<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LinkedIn approved · taktekbot</title>
<style>
  :root { --paper:#F7F5F1; --ink:#0D0D0E; --muted:#6B6B70; --signal:#00A862; }
  @media (prefers-color-scheme: dark) { :root { --paper:#0D0D0E; --ink:#F4F2EE; --muted:#8E8E94; --signal:#2BE38C; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink);
         font:18px/1.5 ui-sans-serif, system-ui, sans-serif; padding:16px; box-sizing:border-box; }
  main { max-width:560px; width:100%; }
  h1 { font-size:28px; letter-spacing:-.02em; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 20px; }
  textarea { width:100%; box-sizing:border-box; height:120px; font:13px/1.4 ui-monospace, monospace; padding:12px;
             border:1px solid var(--muted); border-radius:10px; background:transparent; color:var(--ink); }
  button { margin-top:12px; font:inherit; padding:10px 18px; border-radius:999px; border:0; background:var(--signal); color:#fff; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>Thanks, that worked.</h1>
  <p>Copy this page's address and send it to taktekbot. It's only good for a few minutes, and only with the app's secret.</p>
  <textarea id="u" readonly></textarea>
  <button id="c" type="button">Copy</button>
</main>
<script>
  var u = document.getElementById('u'); u.value = location.href;
  document.getElementById('c').onclick = function () { u.select(); navigator.clipboard.writeText(u.value); this.textContent = 'Copied'; };
</script>
</body>
</html>
